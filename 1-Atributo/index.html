
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atributo JavaScript</title>
</head>
<body>

    <div data-widget-name="Mi primer widget">
        Hola, mundo
    </div>

    <script>
        const elemento = document.querySelector('[data-widget-name]');
        const valor = elemento.getAttribute('data-widget-name');

        document.body.innerHTML += "<p>El atributo es: " + valor + "</p>";
    </script>

</body>
</html>
